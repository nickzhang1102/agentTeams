# Alembic configuration

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# migrations/env.py overrides sqlalchemy.url from DATABASE_URL.
# This value is only a local-development fallback.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/agent_teams

[post_write_hook]
hook = alembic_post_write_hook
config_opts =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
